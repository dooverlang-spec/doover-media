<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두버 업로더 - TikTok 연결</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #222; background: #fff; }
  .err { color: #b00020; }
</style>
</head>
<body>
<h1>두버 업로더</h1>
<p id="out">TikTok 연결을 마무리하는 중…</p>
<script src="app.js"></script>
<script>
(async () => {
  const p = new URLSearchParams(location.search);
  const out = document.getElementById('out');
  const fail = (t) => { out.textContent = t; out.className = 'err'; };
  let expected = null;
  try { expected = sessionStorage.getItem('tt_state'); sessionStorage.removeItem('tt_state'); } catch (e) {}
  if (p.get('error')) return fail('연결이 취소되었거나 실패했습니다: ' + p.get('error'));
  if (!p.get('code') || !expected || p.get('state') !== expected) return fail('잘못된 요청입니다. 처음 화면에서 다시 시도해 주세요.');
  try {
    const { session } = await api('/exchange', { code: p.get('code') });
    sessionStorage.setItem('tt_session', session);
    location.replace('./');
  } catch (e) { fail('연결에 실패했습니다: ' + e.message); }
})();
</script>
</body>
</html>
